name: security

on:
  push:
    branches: [master, main]
  pull_request:

permissions: {}

jobs:
  dependabot-metadata:
    name: Dependabot metadata
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Fetch metadata
        id: dependabot
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
      - name: Save update type
        env:
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: printf '%s\n' "$UPDATE_TYPE" > dependabot-update-type
      - name: Upload metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependabot-metadata
          path: dependabot-update-type
          retention-days: 1

  pip-audit:
    name: pip-audit (Python CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Verify lockfile matches manifests
        run: uv lock --check
      - name: Export locked dependencies
        run: uv export --frozen --no-dev --no-emit-project > requirements.txt
      - name: Audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt

  npm-audit:
    name: npm audit (JS CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install npm dependencies
        run: npm ci --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=high

  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --dev --frozen
      - name: Run bandit (HIGH severity blocks)
        run: uv run bandit -c pyproject.toml -r cptv/ -ll

  eslint-security:
    name: eslint-plugin-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install
        run: npm ci
      - name: Lint
        run: npx eslint .

  trivy:
    name: trivy (container image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Stub GeoLite2 databases
        # trivy scans the built image; we don't need real GeoLite2 data here.
        run: |
          mkdir -p vendor/geolite2
          : > vendor/geolite2/GeoLite2-City.mmdb
          : > vendor/geolite2/GeoLite2-ASN.mmdb
      - name: Build image
        run: docker build -f Containerfile -t cptv:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: cptv:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
